<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 - Owen Portfolio</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-body">
  <div class="login-shell">
    <!-- 左侧品牌故事 -->
    <div class="login-brand">
      <div class="login-brand-top">
        <div class="lb-logo">O</div>
        <span class="lb-name">Owen Portfolio</span>
      </div>
      <div class="lb-copy">
        <h2>把一路走来的成长，<br>整理得足够漂亮。</h2>
        <p>这是 Owen 的大学申请作品集后台。在这里管理履历、故事、影像与每一次被看见的数据。</p>
        <div class="lb-stats">
          <div class="lb-stat"><b>9</b><span>内容板块</span></div>
          <div class="lb-stat"><b>12</b><span>国家访客</span></div>
          <div class="lb-stat"><b>24/7</b><span>稳定在线</span></div>
        </div>
      </div>
      <div class="lb-foot">© 2026 Owen Portfolio · Admin</div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="login-panel">
      <div class="login-form">
        <div class="lf-head">
          <div class="lf-logo">O</div>
          <h3>欢迎回来</h3>
          <p>登录以继续管理你的作品集</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" required>
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
          <div class="login-error" id="loginError"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 如果已登录，直接跳转
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_username', data.username);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorEl.textContent = data.error || '登录失败';
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
      }
    });
  </script>
</body>
</html>
