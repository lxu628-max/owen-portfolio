services:
  - type: web
    name: owen-portfolio
    plan: free
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value:
        description: Supabase 项目 URL（如 https://xxx.supabase.co）
      - key: SUPABASE_KEY
        value:
        description: Supabase anon key 或 service_role key
